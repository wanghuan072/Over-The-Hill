name: IndexNow after production publication

on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.promoted]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-overthehillhub-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.sender.login == 'vercel[bot]' && github.event.sender.type == 'Bot' &&
        github.event.client_payload.environment == 'production' &&
        github.event.client_payload.state.type == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published version and find last successful checkpoint
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/indexnow/ci.mjs prepare
      - name: Restore successful notification checkpoint
        if: steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.previous_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.previous_name }}
          run-id: ${{ steps.prepare.outputs.previous_run }}
          github-token: ${{ github.token }}
          path: .indexnow/previous
      - name: Submit only published changes
        if: steps.prepare.outputs.ready == 'true'
        run: node scripts/indexnow/ci.mjs notify
      - name: Persist only fully accepted notification state
        if: success() && steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact }}
          path: .indexnow/checkpoint.json
          if-no-files-found: error
          retention-days: 90
