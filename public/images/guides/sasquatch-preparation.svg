<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Get the conditions right before searching.</title><rect width="1200" height="700" fill="#203c30"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="14" fill="#d9ac70" font-weight="bold">OVER THE HILL / FIELD NOTES</text><text x="35" y="88" font-size="32" fill="#f9efd8" font-weight="bold">Get the conditions right before searching.</text><text x="35" y="122" font-size="18" fill="#c5ceb6" font-weight="normal">Pack for the job, then check the conditions.</text><rect x="35" y="165" width="550" height="255" rx="8" fill="#e9ebdc"/><image x="65" y="180" width="190" height="190" href="data:image/webp;base64,"/><text x="270" y="255" font-size="26" fill="#294632" font-weight="bold">Camp Tool</text><text x="270" y="298" font-size="20" fill="#617153" font-weight="normal">Let time pass</text><rect x="615" y="165" width="550" height="255" rx="8" fill="#e9ebdc"/><image x="645" y="180" width="190" height="190" href="data:image/webp;base64,"/><text x="850" y="255" font-size="26" fill="#294632" font-weight="bold">Cloud Clearing Bell</text><text x="850" y="298" font-size="20" fill="#617153" font-weight="normal">Clear bad weather temporarily</text><text x="40" y="485" font-size="23" fill="#f9efd8" font-weight="normal">01  /  Locate the northern forest while you can read the terrain.</text><text x="40" y="535" font-size="23" fill="#f9efd8" font-weight="normal">02  /  Wait for night; recheck the actual weather.</text><text x="40" y="585" font-size="23" fill="#f9efd8" font-weight="normal">03  /  Look for a clear view of the subject among the trees.</text><text x="40" y="635" font-size="23" fill="#f9efd8" font-weight="normal">04  /  Confirm the Safari Camera registration before leaving.</text></g></svg>