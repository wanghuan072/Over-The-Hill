<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Find it. Set up the pull. Recover it.</title><rect width="1200" height="700" fill="#203c30"/><g font-family="Arial,sans-serif"><text x="35" y="43" font-size="14" fill="#d9ac70" font-weight="bold">OVER THE HILL / FIELD NOTES</text><text x="35" y="88" font-size="32" fill="#f9efd8" font-weight="bold">Find it. Set up the pull. Recover it.</text><text x="35" y="122" font-size="18" fill="#c5ceb6" font-weight="normal">Pack for the job, then check the conditions.</text><rect x="35" y="165" width="550" height="255" rx="8" fill="#e9ebdc"/><image x="65" y="180" width="190" height="190" href="data:image/webp;base64,"/><text x="270" y="255" font-size="26" fill="#294632" font-weight="bold">Meteorite Radar</text><text x="270" y="298" font-size="20" fill="#617153" font-weight="normal">Find a direction</text><rect x="615" y="165" width="550" height="255" rx="8" fill="#e9ebdc"/><image x="645" y="180" width="190" height="190" href="data:image/webp;base64,"/><text x="850" y="255" font-size="26" fill="#294632" font-weight="bold">Repair Kit</text><text x="850" y="298" font-size="20" fill="#617153" font-weight="normal">Back-up for damage</text><text x="40" y="485" font-size="23" fill="#f9efd8" font-weight="normal">01  /  Find the orange glow or follow the radar direction.</text><text x="40" y="535" font-size="23" fill="#f9efd8" font-weight="normal">02  /  Leave a clear line to drive away from the rock.</text><text x="40" y="585" font-size="23" fill="#f9efd8" font-weight="normal">03  /  Attach the rear winch directly to the meteorite.</text><text x="40" y="635" font-size="23" fill="#f9efd8" font-weight="normal">04  /  Apply throttle and winch pull together.</text></g></svg>